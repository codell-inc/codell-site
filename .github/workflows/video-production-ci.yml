name: Video production checks and deployment

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package*.json"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "wrangler.video.jsonc"
      - ".github/workflows/video-production-ci.yml"
  push:
    branches: [main, feat/video-production-landing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify video release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:video
      - run: npm run test:build
      - name: Validate Worker configuration without publishing
        run: npx wrangler deploy --dry-run --config wrangler.video.jsonc
      - uses: actions/upload-artifact@v4
        with:
          name: video-production-${{ github.sha }}
          path: dist/video/
          if-no-files-found: error
          retention-days: 7

  production:
    name: Publish video.codell.jp
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://video.codell.jp/
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: video-production-${{ github.sha }}
          path: dist/video/
      - name: Reject superseded main commits
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$GITHUB_SHA" = "$latest" || { echo 'Main advanced; deploy the newer run.'; exit 1; }
      - name: Deploy verified assets and custom domain
        run: npx wrangler deploy --config wrangler.video.jsonc
      - name: Verify public HTML, stylesheet and media
        run: |
          for attempt in {1..20}; do
            if node scripts/verify-video-publication.mjs; then exit 0; fi
            sleep 10
          done
          exit 1
